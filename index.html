<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruteo | Planificador de recorridos</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="panel">
      <header>
        <p class="eyebrow">PLANIFICADOR</p>
        <h1>Ruteo</h1>
        <p class="intro">Define tu recorrido, programa cuándo se realizará y guarda el registro.</p>
      </header>

      <form id="route-form">
        <label for="start">Punto de partida</label>
        <div class="input-row">
          <input id="start" name="start" placeholder="Ej. Plaza de Bolívar, Bogotá" required>
          <button class="icon-button" type="button" data-search="start" aria-label="Buscar punto de partida">⌕</button>
        </div>

        <label for="end">Punto final</label>
        <div class="input-row">
          <input id="end" name="end" placeholder="Ej. Parque de la 93, Bogotá" required>
          <button class="icon-button" type="button" data-search="end" aria-label="Buscar punto final">⌕</button>
        </div>

        <div class="two-columns">
          <div>
            <label for="date">Día del ruteo</label>
            <input id="date" name="date" type="date" required>
          </div>
          <div>
            <label for="time">Hora establecida</label>
            <input id="time" name="time" type="time" required>
          </div>
        </div>

        <p id="map-help" class="help">También puedes hacer clic en el mapa: primero el origen y luego el destino.</p>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <button id="calculate" class="primary-button" type="submit">Calcular y guardar ruta</button>
        <button id="reset" class="secondary-button" type="button">Limpiar puntos</button>
      </form>

      <section class="summary" aria-live="polite">
        <div><span>Distancia</span><strong id="distance">—</strong></div>
        <div><span>Duración estimada</span><strong id="duration">—</strong></div>
      </section>

      <section class="history-section">
        <div class="section-title">
          <h2>Rutas guardadas</h2>
          <button id="clear-history" type="button">Borrar todas</button>
        </div>
        <div id="history" class="history"></div>
      </section>
    </aside>
    <section id="map" aria-label="Mapa para seleccionar la ruta"></section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
